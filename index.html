<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafetyNet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
    <div id="toast-container" class="toast-container"></div>
    <div class="app-container">
        <section id="auth-screen" class="auth-screen">
            <div class="auth-card">
                <div class="auth-header">
                    <h2>SafetyNet</h2>
                    <p>Welcome back</p>
                </div>
                <div class="google-login-container">
                    <div id="g_id_onload"
                         data-client_id="668493467457-rci6n6bffsqpobothjau4snemev22vea.apps.googleusercontent.com"
                         data-context="signin"
                         data-ux_mode="popup"
                         data-callback="handleGoogleLogin"
                         data-auto_prompt="false">
                    </div>
                    <div class="g_id_signin"
                         data-type="standard"
                         data-shape="rectangular"
                         data-theme="outline"
                         data-text="signin_with"
                         data-size="large"
                         data-logo_alignment="left">
                    </div>
                </div>
            </div>
        </section>

        <section id="dashboard-screen" class="dashboard-screen hidden">
            <header class="navbar">
                <div class="nav-brand">SafetyNet</div>
                <div class="user-profile">
                    <span id="user-display-name" class="user-name"></span>
                    <button class="btn-text" onclick="handleLogout()">Logout</button>
                </div>
            </header>

            <main class="dashboard-content">
                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-label">Total</span>
                        <span class="stat-value" id="stat-total">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Pending</span>
                        <span class="stat-value" id="stat-pending">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Done</span>
                        <span class="stat-value" id="stat-completed">0</span>
                    </div>
                </div>

                <div class="action-bar">
                    <input type="text" id="search-input" placeholder="Search..." oninput="filterTasks()">
                    <div class="filter-group">
                        <button class="filter-chip active" data-filter="all" onclick="setFilter('all')">All</button>
                        <button class="filter-chip" data-filter="pending" onclick="setFilter('pending')">Pending</button>
                        <button class="filter-chip" data-filter="completed" onclick="setFilter('completed')">Done</button>
                    </div>
                    <div class="btn-group">
                        <button class="btn-outline" onclick="clearCompletedTasks()">Clear</button>
                        <button class="btn-primary" onclick="openTaskModal()">New Task</button>
                    </div>
                </div>

                <div class="task-section">
                    <div id="task-list" class="task-list"></div>
                    <div id="empty-state" class="empty-state hidden">No tasks found</div>
                </div>
            </main>
        </section>
    </div>

    <div id="task-modal" class="modal-overlay hidden" onclick="closeTaskModalOnOverlay(event)">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-title">Task</h3>
            </div>
            <form id="task-form" onsubmit="handleSaveTask(event)">
                <input type="hidden" id="task-id">
                <div class="input-group">
                    <label for="task-title-input">Title</label>
                    <input type="text" id="task-title-input" required>
                </div>
                <div class="input-group">
                    <label for="task-desc-input">Description</label>
                    <textarea id="task-desc-input" rows="2"></textarea>
                </div>
                <div class="form-row">
                    <div class="input-group">
                        <label for="task-category">Category</label>
                        <select id="task-category">
                            <option value="Work">Work</option>
                            <option value="Personal">Personal</option>
                            <option value="Study">Study</option>
                            <option value="Health">Health</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="task-priority">Priority</label>
                        <select id="task-priority">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                </div>
                <div class="input-group">
                    <label for="task-due-date">Due Date</label>
                    <input type="date" id="task-due-date">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-outline" onclick="closeTaskModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
